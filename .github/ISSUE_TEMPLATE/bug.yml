name: Problema / Bug
description: Algo não funciona como deveria / Something doesn't work
labels: [bug]
body:
  - type: textarea
    id: o-que
    attributes:
      label: O que aconteceu? / What happened?
      description: Conte o que você fez, o que esperava e o que viu. / What you did, what you expected and what you saw.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como repetir / Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: versao
    attributes:
      label: Versão do Cais / Cais version
      description: Preferências > Sobre / Settings > About
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows (versão e build) / Windows (version and build)
      placeholder: Windows 11 24H2 (26100)
  - type: textarea
    id: monitores
    attributes:
      label: Monitores e escala / Displays and scaling
      placeholder: 2 monitores, 2560x1440 a 100% e 3440x1440 a 100%
  - type: markdown
    attributes:
      value: |
        Antes de anexar prints, confira se não aparecem dados pessoais. / Before attaching screenshots, make sure no personal data shows.
