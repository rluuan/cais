name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Compilar, testar e provar que não há rede
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust estável
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Compilar
        run: cargo build --release --locked

      - name: Testes
        run: cargo test --release --locked

      - name: Instalar o cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Nenhuma biblioteca de rede, TLS ou telemetria (cargo-deny)
        run: cargo deny check bans licenses sources

      - name: O executável não importa DLLs de rede
        shell: pwsh
        run: ./scripts/verificar-privacidade.ps1

      - name: Guardar o executável
        uses: actions/upload-artifact@v4
        with:
          name: cais-${{ github.sha }}
          path: target/release/cais.exe
